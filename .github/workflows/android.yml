name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        accept-android-sdk-licenses: false
        packages: platform-tools

    - name: Accept Android SDK licenses and install build packages
      run: |
        set +o pipefail
        yes | sdkmanager --licenses
        sdkmanager "platforms;android-35" "build-tools;35.0.0"

    - name: Install Cordova
      run: npm install -g cordova

    - name: Install dependencies
      run: npm install

    - name: Remove Android platform if exists
      run: cordova platform rm android || echo "Platform not present"

    - name: Add Android platform
      run: cordova platform add android

    - name: Prepare Cordova
      run: cordova prepare android

    - name: Build Android APK
      run: cordova build android --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
